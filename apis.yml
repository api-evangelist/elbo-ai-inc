aid: elbo-ai-inc
name: ELBO AI, INC
description: >-
  ELBO AI, INC operates Puppetry (puppetry.com), an AI video-creation platform that
  turns any portrait photo into a realistic lip-synced talking-head video. Users upload
  an image, provide a script or audio, pick from 500+ AI voices across 65+ languages, and
  Puppetry renders a video in minutes — with voice cloning, AI Stories multi-scene
  storytelling, caption studio, and cartoon/object animation. Beyond the studio web and
  iOS apps and a Canva integration, Puppetry ships a Developer API beta (Studio plan) for
  agents and app integrations: a Puppetry Voice API (list voices + TTS), hosted audio
  uploads with signed URLs, and credit-backed text-to-video and audio-to-video jobs with
  idempotent creation and job-and-poll status. It publishes an OpenAPI 3.1 spec, an
  official TypeScript SDK, an MCP server, llms.txt, and an ai-plugin.json manifest.
  Founded by ex-Google/Microsoft/Apple/Amazon engineers; backed by 500 Global.
